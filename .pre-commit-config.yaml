minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
default_language_version:
  python: python3.14
exclude: ^\.hooks/

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
        stages: [manual]
      - id: check-useless-excludes
        stages: [manual]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: fix-byte-order-marker
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        stages: [pre-commit]
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: detect-private-key
      - id: forbid-submodules
      - id: destroyed-symlinks
        stages: [pre-commit]
      - id: check-json
      - id: check-toml
      - id: check-ast
      - id: debug-statements

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - --force-scope
          - --scopes=repo,docs,userscript,deps,utils,engine,cli,ci
          - feat
          - fix
          - chore
          - docs
          - refactor
          - test
          - perf
          - style
          - ci
          - build
          - revert

  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        args: [--force-exclude]
        types_or: [python, pyi, javascript, jsx, ts, tsx, rust, shell]
        stages: [pre-commit]

  - repo: https://github.com/hukkin/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        args: [--number]
        additional_dependencies:
          - mdformat-gfm==0.4.1
          - mdformat-tables==1.0.0
          - mdformat-frontmatter==2.0.8

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-replacement-char
        name: no U+FFFD replacement character
        entry: python .hooks/text_guard.py
        language: python
        types: [text]
      - id: no-secret-tokens
        name: no API tokens in tracked files
        entry: python .hooks/secret_tokens.py
        language: python
        types: [text]
      - id: no-ai-trailers
        name: no AI attribution in the commit message
        entry: python .hooks/ai_trailers.py
        language: python
        stages: [commit-msg]
      - id: const-docstrings
        name: docstring under every constant
        entry: python .hooks/const_docstrings.py
        language: python
        types: [python]
      - id: no-test-prose
        name: no comments or prose in tests
        entry: python .hooks/prose_guard.py
        language: python
        files: \.(py|ts|tsx|js|jsx|mjs|cjs|mts|cts)$
      - id: no-mutating-assign
        name: no assignment that mutates its own target container
        entry: python .hooks/mutating_assign.py
        language: python
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pytest
        name: pytest
        entry: uv run pytest -m "not network" -n 6
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: userscript-tests
        name: userscript tests
        entry: node --test userscript/
        language: node
        language_version: "26"
        files: ^userscript/
        pass_filenames: false
        stages: [pre-push]
