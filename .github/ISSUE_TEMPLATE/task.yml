name: Task / Chore
description: Technical task, cleanup, tech debt, research
title: "chore(scope): "
labels: ["infra"]
body:
  - type: textarea
    id: description
    attributes:
      label: What needs to be done
      description: A concrete task. Can be research, refactor, tech-debt, cleanup.
      placeholder: "Measure the real document size limit of ElevenReader."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area (you can add more via labels after creating)
      options:
        - engine
        - cli
        - utils
        - userscript
        - deps
        - docs
        - ci
        - repo
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      value: |
        - [ ]
    validations:
      required: false
