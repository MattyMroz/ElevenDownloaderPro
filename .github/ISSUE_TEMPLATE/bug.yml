name: Bug
description: Something does not work as expected
title: "fix(scope): "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: ElevenDownloaderPro commit (`git rev-parse --short HEAD`) for the CLI, or the userscript `@version` from the Tampermonkey dashboard.
      placeholder: "ElevenDownloaderPro 1a2b3c4 / userscript 2.0.1"
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Route
      options:
        - CLI (edp)
        - Tampermonkey userscript
        - both
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and Tampermonkey version
      description: Needed for the userscript route; versions from chrome://version and the Tampermonkey dashboard.
      placeholder: "Chrome <version>, Tampermonkey <version>"
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. uv run edp record chapter.txt --voice fronczewski
        2. play chapter.mp3 from the start
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "chapter.mp3 starts with the first word of the text."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: "The first two minutes are missing."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The stderr log and stdout JSON of `edp`, or the browser console lines starting with `[EDP]`.
      render: text
    validations:
      required: false
